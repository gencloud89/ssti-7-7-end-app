name: Build 3 nền tảng

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sources/android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Chuẩn bị Go runtime
        run: echo "Bỏ qua bước vá Go vì template Android hiện tại đã build được trực tiếp."

      - name: Cho phép chạy Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build Android release
        run: ./gradlew --no-daemon app:assembleAlphaRelease app:bundleAlphaRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            sources/android/app/build/outputs/apk/alpha/release/*.apk
            sources/android/app/build/outputs/bundle/alphaRelease/*.aab

  build_windows:
    name: Build Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sources/desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          targets: x86_64-pc-windows-msvc

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Install dependencies
        run: pnpm i

      - name: Prepare sidecar
        run: pnpm run prebuild x86_64-pc-windows-msvc

      - name: Build Windows bundle
        run: pnpm build --target x86_64-pc-windows-msvc
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            sources/desktop/target/x86_64-pc-windows-msvc/release/bundle/nsis/*setup*.exe

  build_macos:
    name: Build macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: sources/desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.0"
          targets: aarch64-apple-darwin

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24.15.0"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
          run_install: false

      - name: Install dependencies
        run: pnpm i

      - name: Prepare sidecar
        run: pnpm run prebuild aarch64-apple-darwin

      - name: Build macOS bundle
        run: pnpm build --target aarch64-apple-darwin
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            sources/desktop/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
